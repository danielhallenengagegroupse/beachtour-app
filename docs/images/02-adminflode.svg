<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#0f172a">Komplett adminflode (en vecka)</text>

  <g font-family="Arial, sans-serif" font-size="19" fill="#0f172a">
    <rect x="120" y="100" width="960" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="600" y="155" text-anchor="middle">1. Logga in i adminpanelen</text>

    <rect x="120" y="230" width="960" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="285" text-anchor="middle">2. Skapa veckan (veckonummer + datum)</text>

    <rect x="120" y="360" width="960" height="90" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="600" y="415" text-anchor="middle">3. Lagg till deltagare (manuellt eller via kalenderimport)</text>

    <rect x="120" y="490" width="960" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="545" text-anchor="middle">4. Ange antal rundor och generera matcher</text>

    <rect x="120" y="620" width="960" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="600" y="675" text-anchor="middle">5. Registrera resultat (match for match)</text>

    <rect x="120" y="750" width="960" height="90" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="805" text-anchor="middle">6. Markera "Vecka klar" och kontrollera tabeller</text>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="600" y1="190" x2="600" y2="230"/>
    <line x1="600" y1="320" x2="600" y2="360"/>
    <line x1="600" y1="450" x2="600" y2="490"/>
    <line x1="600" y1="580" x2="600" y2="620"/>
    <line x1="600" y1="710" x2="600" y2="750"/>
  </g>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>