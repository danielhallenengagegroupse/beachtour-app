<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f5f7fb"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#0f172a">Systemoversikt: VK Bjarke Beach Tour</text>

  <rect x="60" y="120" width="300" height="160" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="210" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e3a8a">Publika besokare</text>
  <text x="210" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a">www.vkbjarke.se</text>
  <text x="210" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">Ser matcher och tabeller</text>

  <rect x="450" y="120" width="300" height="160" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="600" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#14532d">Next.js-app</text>
  <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#14532d">Admin + publik webb</text>
  <text x="600" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#14532d">API for spelare, veckor, matcher</text>

  <rect x="840" y="120" width="300" height="160" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="990" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#7f1d1d">PostgreSQL-databas</text>
  <text x="990" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7f1d1d">Veckor, matcher, poang</text>
  <text x="990" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f1d1d">Prisma skoter allt DB-anrop</text>

  <rect x="160" y="390" width="360" height="190" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="340" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#9a3412">Cloudflare tunnel</text>
  <text x="340" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">Publicerar lokal app pa internet</text>
  <text x="340" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">Stabil doman eller snabb tunnel</text>
  <text x="340" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">Windows Scheduled Tasks for drift</text>

  <rect x="680" y="390" width="360" height="190" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="860" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4c1d95">Admin-arbete</text>
  <text x="860" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4c1d95">1) Skapa vecka</text>
  <text x="860" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4c1d95">2) Lagg till deltagare</text>
  <text x="860" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4c1d95">3) Generera matcher och rapportera resultat</text>

  <line x1="360" y1="200" x2="450" y2="200" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="750" y1="200" x2="840" y2="200" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="280" x2="600" y2="360" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="360" x2="340" y2="390" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="360" x2="860" y2="390" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>